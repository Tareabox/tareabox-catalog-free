<body>

<style>
  /* Fonts bundled in tb-media so the render never depends on the network. */
  @font-face { font-family: "TB Geist Mono"; src: url("../assets/tb-media/tb-font-geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "TB Anton"; src: url("../assets/tb-media/tb-font-anton.woff2") format("woff2"); font-weight: 400; font-display: block; }
  /* ═══════════════════════════════════════════════════════ */
  /* 🎨 CUSTOMIZE HERE                                    */
  /* ═══════════════════════════════════════════════════════ */
  [data-composition-id="data-folder-counter-24-tb-v"] {
    --tb-dark:         #09090b;
    --tb-text:         #D6D3D1;
    --tb-accent:       var(--tb-brand-accent, #FE83B9);
    --tb-check:        #4ADE80;
    --tb-font-mono:    var(--tb-brand-font-mono, "TB Geist Mono", "Geist Mono", ui-monospace, monospace);
    --tb-font-number:  "TB Anton", "Anton", Impact, sans-serif;
  }
  /* ═══════════════════════════════════════════════════════ */
  /* ⛔ EFFECT CODE                                          */
  /* ═══════════════════════════════════════════════════════ */
  [data-composition-id="data-folder-counter-24-tb-v"] {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(80% 70% at 70% 45%, #16131a, var(--tb-dark) 75%);
    font-family: var(--tb-font-mono); color: var(--tb-text);
  }
  [data-composition-id="data-folder-counter-24-tb-v"] * { margin: 0; padding: 0; box-sizing: border-box; }
  [data-composition-id="data-folder-counter-24-tb-v"] .bar {
    position: absolute; left: 70px; right: 70px; top: 90px;
    display: flex; justify-content: space-between; gap: 24px;
    font-size: clamp(20px, 2.6vmin, 32px); color: #6b6661; white-space: nowrap;
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .bar b { color: #a8a29e; font-weight: 600; }
  [data-composition-id="data-folder-counter-24-tb-v"] .cmd {
    position: absolute; left: 70px; top: 900px; white-space: nowrap;
    font-size: clamp(30px, 4.4vmin, 64px); font-weight: 600; color: #E7E5E4;
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .cmd .pr { color: var(--tb-check); margin-right: 0.6em; }
  [data-composition-id="data-folder-counter-24-tb-v"] .view {
    position: absolute; left: 70px; width: 940px; top: 1010px; height: 800px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .stack { position: absolute; left: 0; right: 0; top: 0; }
  [data-composition-id="data-folder-counter-24-tb-v"] .it {

    font-size: clamp(26px, 4.0vmin, 54px); line-height: 1.42; display: none;
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .it .ck { color: var(--tb-check); }
  [data-composition-id="data-folder-counter-24-tb-v"] .count {
    position: absolute; left: 540px; top: 540px; transform: translate(-50%, -50%);
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .count-in { display: flex; flex-direction: column; align-items: center; gap: 0.2em; }
  [data-composition-id="data-folder-counter-24-tb-v"] .num {
    position: relative; height: 1em; width: 3ch; font-family: var(--tb-font-number); color: var(--tb-accent);
    font-size: clamp(160px, 44.44vmin, 480px); line-height: 1; letter-spacing: -0.01em;
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .num span {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%); opacity: 0; white-space: nowrap;
    text-shadow: 0 0 60px color-mix(in srgb, var(--tb-accent) 35%, transparent);
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .lbl {
    position: relative; height: 1.3em; width: 100%;
    font-size: clamp(28px, 3.8vmin, 56px); font-weight: 600; color: #E7E5E4; white-space: nowrap;
  }
  [data-composition-id="data-folder-counter-24-tb-v"] .lbl span { position: absolute; left: 50%; top: 0; transform: translateX(-50%); }

<div class="bar"><span><b data-k="header">you@studio ~/tareabox</b></span><span data-k="tag">tareabox · archive</span></div>
<div class="cmd"><span class="pr">&#x276F;</span><span class="cmdt"></span></div>
<div class="view"><div class="stack" data-layout-allow-overflow></div></div>
<div class="count"><div class="count-in">
  <div class="num"></div>
  <div class="lbl"><span class="l1" data-k="label">posts</span><span class="l2" data-k="final">posts · 0 all-nighters</span></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines["data-folder-counter-24-tb-v"] = (function () {
    const ID = "data-folder-counter-24-tb-v", DUR = 9, ANCHOR = 800;
    const root = document.querySelector('[data-composition-id="' + ID + '"]');
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const val = (k, d) => (V[k] !== undefined && V[k] !== null && V[k] !== "") ? String(V[k]) : d;
    root.querySelectorAll("[data-k]").forEach((el) => { el.textContent = val(el.dataset.k, el.textContent); });
    if (V.accent) root.style.setProperty("--tb-accent", V.accent);
    if (V.check) root.style.setProperty("--tb-check", V.check);

    const DEFAULT_ITEMS = "Monday Motivation|Behind the Scenes|Client Win (Bakery)|Launch Day|Launch Day (Again)|Carousel: 5 Tips|Reel: Morning Routine|Reel: Desk Tour|Q&A Friday|Before & After|Testimonial (Ana)|Testimonial (Marco)|Product Drop|Flash Sale|Meet the Team|Hot Take|Myth vs Fact|Tutorial: Captions|Throwback Thursday|Giveaway|Poll: Pick One|Case Study|New Offer|Newsletter Recap|Holiday Post|Year in Review|Weekend Vibes|Ask Me Anything|Thank You 1K";
    const items = val("items", DEFAULT_ITEMS).split("|").map((s) => s.trim()).filter(Boolean).slice(0, 60);
    const command = val("command", "ls ~/Content\\ Ideas");

    // Command characters (typed), list rows, and one number element per count.
    const cmdT = root.querySelector(".cmdt");
    const cmdChars = [...command].map((c) => { const s = document.createElement("span"); s.textContent = c; s.style.opacity = 0; cmdT.appendChild(s); return s; });
    const stack = root.querySelector(".stack");
    const rows = items.map((name) => {
      const r = document.createElement("div");
      r.className = "it";
      r.innerHTML = '<span class="ck">✓</span><span class="nm"></span>';
      r.querySelector(".nm").textContent = name.endsWith("/") ? name : name + "/";
      stack.appendChild(r);
      return r;
    });
    const numBox = root.querySelector(".num");
    const nums = [];
    for (let i = 0; i <= items.length; i++) { const s = document.createElement("span"); s.textContent = String(i); numBox.appendChild(s); nums.push(s); }
    rows.forEach((r) => (r.style.display = "flex"));
    const hs = rows.map((r) => r.offsetHeight);
    rows.forEach((r) => (r.style.display = ""));

    const tl = gsap.timeline({ paused: true });
    // 1) type the command
    cmdChars.forEach((c, j) => tl.set(c, { opacity: 1 }, 0.25 + j * 0.035));
    const t0 = 0.45 + cmdChars.length * 0.035;
    tl.fromTo(".count-in", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.7)" }, t0);
    tl.set(nums[0], { opacity: 1 }, t0);
    // 2) rows land one by one, accelerating; the counter follows each row.
    const LIST_END = DUR - 2.0;
    const n = rows.length;
    let prev = 0, first = 0, curY = 0, contentH = 0;
    rows.forEach((r, i) => {
      const p = (i + 1) / n;
      const t = t0 + 0.3 + (LIST_END - t0 - 0.3) * (1 - Math.pow(1 - p, 1.6));
      tl.set(r, { display: "flex" }, t);
      contentH += hs[i];
      const target = Math.min(0, ANCHOR - contentH);
      if (target !== curY) tl.set(stack, { y: target }, t);
      curY = target;
      // Rows that scrolled fully above the window are removed; the stack is compensated so nothing moves.
      while (first < i && curY + hs[first] <= 0) {
        tl.set(rows[first], { display: "none" }, t);
        contentH -= hs[first]; curY += hs[first]; first++;
        tl.set(stack, { y: curY }, t);
      }
      tl.set(nums[prev], { opacity: 0 }, t);
      tl.set(nums[i + 1], { opacity: 1 }, t);
      prev = i + 1;
    });
    // 3) final punch: number pops, label grows.
    tl.fromTo(numBox, { scale: 1 }, { scale: 1.12, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, LIST_END + 0.05);
    tl.to(".l1", { opacity: 0, duration: 0.2 }, LIST_END + 0.4);
    tl.fromTo(".l2", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, LIST_END + 0.45);

    tl.to({}, { duration: DUR }, 0);
    return tl;
  })();
</script>
</div>
</body>
</html>
