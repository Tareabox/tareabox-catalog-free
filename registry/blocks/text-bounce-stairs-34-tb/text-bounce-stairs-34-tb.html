<!doctype html>
<!--
  © 2026 Natalie Digital · tareabox.com · Tareabox Hyperframes Pack
  text-bounce-stairs-34-tb
  Tareabox Hyperframes Effect
  Description: A glowing ball drops and bounces from line to line; each landing squashes the ball,
  kicks up dust and reveals the next line in a staircase. The last line lands in italic.
  Category: text
  Duration: 5 seconds
  Suggested sound: a soft "bounce" on each landing (0.55 · 1.25 · 1.95 · 2.75 s).
  REQUIRES: gsap (CDN)
-->
<html lang="en" data-composition-variables='[
  {"id":"line1","type":"string","label":"Line 1","default":"Write the idea,"},
  {"id":"line2","type":"string","label":"Line 2","default":"pick the blocks,"},
  {"id":"line3","type":"string","label":"Line 3","default":"hit render,"},
  {"id":"line4","type":"string","label":"Line 4 (italic)","default":"and go grab a coffee."},
  {"id":"ball","type":"color","label":"Ball + italic color","default":"#33efe0"},
  {"id":"bg","type":"string","label":"Background (color or \"transparent\")","default":"#0e1916"}
]'>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Instrument+Serif:ital@1&display=block" rel="stylesheet" />
</head>
<body>
<div id="text-bounce-stairs-34-tb" data-composition-id="text-bounce-stairs-34-tb"
     data-width="1920" data-height="1080"
     data-start="0" data-duration="5">
<style>
    /* ═══════════════════════════════════════════════════════ */
    /* 🎨 CUSTOMIZE HERE                                       */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="text-bounce-stairs-34-tb"] {
      --tb-bg:           #0e1916;
      --tb-text:         #f6f0ed;
      --tb-accent:       var(--tb-brand-accent, #33efe0);   /* ball + italic line */
      --tb-dust:         #f6f0ed;
      --tb-font-display: var(--tb-brand-font-display, "Geist", sans-serif);
      --tb-font-italic:  var(--tb-brand-font-italic, "Instrument Serif", serif);

      --line1: "Write the idea,";
      --line2: "pick the blocks,";
      --line3: "hit render,";
      --line4: "and go grab a coffee.";
    }
    /* ═══════════════════════════════════════════════════════ */
    /* ⛔ EFFECT CODE                                          */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="text-bounce-stairs-34-tb"] {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse 70% 70% at 50% 50%,
        color-mix(in srgb, var(--tb-bg) 86%, #fff) 0%, var(--tb-bg) 68%,
        color-mix(in srgb, var(--tb-bg) 70%, #000) 100%);
    }
    [data-composition-id="text-bounce-stairs-34-tb"] * { margin: 0; padding: 0; box-sizing: border-box; }
    [data-composition-id="text-bounce-stairs-34-tb"] .word {
      position: absolute; left: 0; top: 0;
      font-family: var(--tb-font-display); font-weight: 900;
      font-size: clamp(36px, 6.6vmin, 140px); line-height: 1; letter-spacing: -0.02em;
      color: var(--tb-text); white-space: nowrap; opacity: 0; text-transform: uppercase;
    }
    [data-composition-id="text-bounce-stairs-34-tb"] .word.it {
      font-family: var(--tb-font-italic); font-style: italic; font-weight: 400;
      font-size: clamp(42px, 8vmin, 170px); letter-spacing: 0;
      color: var(--tb-accent); text-transform: none;
    }
    [data-composition-id="text-bounce-stairs-34-tb"] .ball {
      position: absolute; left: 0; top: 0;
      width: 4.2vmin; height: 4.2vmin; margin: -2.1vmin 0 0 -2.1vmin; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tb-accent) 35%, #fff) 0%,
        var(--tb-accent) 40%, color-mix(in srgb, var(--tb-accent) 70%, #000) 100%);
      box-shadow: 0 0 2.4vmin 0.8vmin color-mix(in srgb, var(--tb-accent) 55%, transparent),
                  0 0 6.5vmin 2vmin color-mix(in srgb, var(--tb-accent) 22%, transparent);
    }
    [data-composition-id="text-bounce-stairs-34-tb"] .dust {
      position: absolute; left: 0; top: 0;
      width: 1vmin; height: 1vmin; margin: -0.5vmin 0 0 -0.5vmin; border-radius: 50%;
      background: var(--tb-dust); opacity: 0;
    }
</style>
    <div class="word" id="bs34h-w1"></div>
    <div class="word" id="bs34h-w2"></div>
    <div class="word" id="bs34h-w3"></div>
    <div class="word it" id="bs34h-w4"></div>
    <div class="dust d1"></div><div class="dust d1"></div><div class="dust d1"></div><div class="dust d1"></div>
    <div class="dust d2"></div><div class="dust d2"></div><div class="dust d2"></div><div class="dust d2"></div>
    <div class="dust d3"></div><div class="dust d3"></div><div class="dust d3"></div><div class="dust d3"></div>
    <div class="dust d4"></div><div class="dust d4"></div><div class="dust d4"></div><div class="dust d4"></div>
    <div class="ball" id="bs34h-ball"></div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
    window.__timelines = window.__timelines || {};
    window.__timelines["text-bounce-stairs-34-tb"] = (function () {
      const root = document.querySelector('[data-composition-id="text-bounce-stairs-34-tb"]');
      const q = (s) => root.querySelector(s), qa = (s) => root.querySelectorAll(s);

      /* Native HyperFrames variables → override CSS custom properties */
      const V = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables() : {};
      const setStr = (cssVar, val) => {
        if (val !== undefined && val !== null && val !== "")
          root.style.setProperty(cssVar, '"' + String(val) + '"');
      };
      const setRaw = (cssVar, val) => {
        if (val !== undefined && val !== null && val !== "")
          root.style.setProperty(cssVar, String(val));
      };
      setStr("--line1", V.line1); setStr("--line2", V.line2);
      setStr("--line3", V.line3); setStr("--line4", V.line4);
      setRaw("--tb-accent", V.ball); setRaw("--tb-bg", V.bg);

      const cs  = getComputedStyle(root);
      const unq = (k) => cs.getPropertyValue(k).trim().replace(/^["']|["']$/g, "");

      /* Staircase layout computed from the canvas (any aspect ratio, no measuring) */
      const W = parseFloat(root.getAttribute("data-width")), H = parseFloat(root.getAttribute("data-height"));
      const M = Math.min(W, H);
      const LH    = M * 0.16;                           /* distance between lines */
      const BASEX = W / 2 - M * 0.40;                   /* left edge of the staircase */
      const STEP  = [0, 0.12, 0.24, 0.04];              /* stair offsets (× M) */
      const TOP0  = H / 2 - LH * 1.75;
      const R     = M * 0.021;                          /* ball radius */
      const TIMES = [0.55, 1.25, 1.95, 2.75];

      const LAND = TIMES.map((t, i) => {
        const left = BASEX + STEP[i] * M, top = TOP0 + i * LH;
        const el = q(`#bs34h-w${i + 1}`);
        el.textContent = unq(`--line${i + 1}`);
        el.style.left = left + "px"; el.style.top = top + "px";
        return { x: left + M * 0.10, y: top + M * 0.008 - R, t, el, d: `.d${i + 1}` };
      });

      const ball = q("#bs34h-ball");
      const tl = gsap.timeline({ paused: true });
      tl.set(ball, { x: W / 2, y: -M * 0.08 }, 0);
      tl.to(ball, { y: LAND[0].y, duration: 0.5, ease: "power2.in" }, 0.05);
      tl.to(ball, { x: LAND[0].x, duration: 0.5, ease: "none" }, 0.05);
      for (let i = 1; i < LAND.length; i++) {
        const a = LAND[i - 1], b = LAND[i], dur = b.t - a.t, peak = Math.min(a.y, b.y) - M * 0.21;
        tl.to(ball, { x: b.x, duration: dur, ease: "none" }, a.t);
        tl.to(ball, { y: peak, duration: dur / 2, ease: "power2.out" }, a.t);
        tl.to(ball, { y: b.y, duration: dur / 2, ease: "power2.in" }, a.t + dur / 2);
      }
      const DUST = [[-46, -18], [-22, -34], [24, -32], [48, -16]];
      LAND.forEach((p) => {
        tl.to(ball, { scaleX: 1.35, scaleY: 0.68, duration: 0.06, ease: "power1.out" }, p.t);
        tl.to(ball, { scaleX: 1, scaleY: 1, duration: 0.22, ease: "elastic.out(1, 0.45)" }, p.t + 0.06);
        tl.fromTo(p.el, { opacity: 0, y: M * 0.024, scaleY: 0.7, transformOrigin: "50% 100%" },
                        { opacity: 1, y: 0, scaleY: 1, duration: 0.3, ease: "back.out(2.4)" }, p.t);
        qa(p.d).forEach((el, k) => {
          const [dx, dy] = DUST[k].map((v) => v * M / 1080);
          tl.fromTo(el, { x: p.x, y: p.y + R, opacity: 0.85, scale: 1 },
                        { x: p.x + dx, y: p.y + R + dy, opacity: 0, scale: 0.3, duration: 0.45, ease: "power2.out", immediateRender: false }, p.t);
        });
      });
      /* small final hop, then the ball rests on the last line */
      const last = LAND[LAND.length - 1];
      tl.to(ball, { y: last.y - M * 0.083, duration: 0.25, ease: "power2.out" }, last.t + 0.25);
      tl.to(ball, { y: last.y, duration: 0.25, ease: "power2.in" }, last.t + 0.5);
      tl.to(ball, { scaleX: 1.25, scaleY: 0.78, duration: 0.05 }, last.t + 0.75);
      tl.to(ball, { scaleX: 1, scaleY: 1, duration: 0.2, ease: "elastic.out(1, 0.5)" }, last.t + 0.8);

      tl.to({}, { duration: 5 }, 0);
      return tl;
    })();
  </script>
</div>
</body>
</html>
