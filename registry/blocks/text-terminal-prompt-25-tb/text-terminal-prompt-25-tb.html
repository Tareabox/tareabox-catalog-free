<!doctype html>
<!--
  © 2026 Natalie Digital · tareabox.com · Tareabox Hyperframes Pack
  text-terminal-prompt-25-tb (horizontal 1920x1080)
  Tareabox Hyperframes Effect
  Description: A terminal permission box asks three times; the cursor says Yes, Yes, then crawls down to No — and a giant TOO LATE! stamp slams in with a shake while a meter maxes out.
  Category: text
  Duration: 9 seconds
  REQUIRES: gsap (CDN)
-->
<html lang="en" data-composition-variables='[
  {"id":"header","type":"string","label":"Header (left)","default":"you@studio ~/tareabox"},
  {"id":"tag","type":"string","label":"Header (right)","default":"tareabox · autopilot"},
  {"id":"ask1","type":"string","label":"Question 1","default":"Allow AI to write your captions?"},
  {"id":"ask2","type":"string","label":"Question 2","default":"Allow AI to design your posts?"},
  {"id":"ask3","type":"string","label":"Question 3","default":"Allow AI to plan a whole month?"},
  {"id":"opt1","type":"string","label":"Option 1","default":"Yes"},
  {"id":"opt2","type":"string","label":"Option 2","default":"Yes, and don&#39;t ask again"},
  {"id":"opt3","type":"string","label":"Option 3","default":"No, let&#39;s not get ahead—"},
  {"id":"stamp","type":"string","label":"Stamp text","default":"TOO LATE!"},
  {"id":"meter","type":"string","label":"Meter label","default":"creativity"},
  {"id":"command","type":"string","label":"Bottom command","default":"$ tareabox --autopilot --no-limits"},
  {"id":"accent","type":"color","label":"Box + final choice color","default":"#FE83B9"},
  {"id":"stampColor","type":"color","label":"Stamp color","default":"#FF5A4E"}
]'>
<head>
  <meta charset="UTF-8" />
</head>
<body>
<div id="text-terminal-prompt-25-tb" data-composition-id="text-terminal-prompt-25-tb"
     data-width="1920" data-height="1080" data-start="0" data-duration="9">
<style>
  /* Fonts bundled in tb-media so the render never depends on the network. */
  @font-face { font-family: "TB Geist Mono"; src: url("../assets/tb-media/tb-font-geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  @font-face { font-family: "TB Anton"; src: url("../assets/tb-media/tb-font-anton.woff2") format("woff2"); font-weight: 400; font-display: block; }
  /* ═══════════════════════════════════════════════════════ */
  /* 🎨 CUSTOMIZE HERE                                    */
  /* ═══════════════════════════════════════════════════════ */
  [data-composition-id="text-terminal-prompt-25-tb"] {
    --tb-dark:        #09090b;
    --tb-text:        #D6D3D1;
    --tb-accent:      var(--tb-brand-accent, #FE83B9);
    --tb-yes:         #4ADE80;
    --tb-stamp:       #FF5A4E;
    --tb-font-mono:   var(--tb-brand-font-mono, "TB Geist Mono", "Geist Mono", ui-monospace, monospace);
    --tb-font-stamp:  "TB Anton", "Anton", Impact, sans-serif;
  }
  /* ═══════════════════════════════════════════════════════ */
  /* ⛔ EFFECT CODE                                          */
  /* ═══════════════════════════════════════════════════════ */
  [data-composition-id="text-terminal-prompt-25-tb"] {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(80% 70% at 50% 45%, #17131a, var(--tb-dark) 75%);
    font-family: var(--tb-font-mono); color: var(--tb-text);
  }
  [data-composition-id="text-terminal-prompt-25-tb"] * { margin: 0; padding: 0; box-sizing: border-box; }
  [data-composition-id="text-terminal-prompt-25-tb"] .scene { position: absolute; inset: 0; }
  [data-composition-id="text-terminal-prompt-25-tb"] .bar {
    position: absolute; left: 90px; right: 90px; top: 48px;
    display: flex; justify-content: space-between; gap: 24px;
    font-size: clamp(20px, 2.6vmin, 32px); color: #6b6661; white-space: nowrap;
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .bar b { color: #a8a29e; font-weight: 600; }
  [data-composition-id="text-terminal-prompt-25-tb"] .box {
    position: absolute; left: 50%; top: 420px; width: 1320px; transform: translate(-50%, -50%);
    border: 3px solid var(--tb-accent); border-radius: 14px; background: rgba(12, 10, 12, 0.92);
    padding: 0.7em 0.8em 0.8em; font-size: clamp(30px, 5.4vmin, 60px); font-weight: 600;
    box-shadow: 0 0 80px color-mix(in srgb, var(--tb-accent) 18%, transparent);
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .titles { display: grid; margin-bottom: 0.35em; }
  [data-composition-id="text-terminal-prompt-25-tb"] .titles span { grid-area: 1 / 1; color: #F5F5F4; opacity: 0; line-height: 1.25; }
  [data-composition-id="text-terminal-prompt-25-tb"] .opt {
    position: relative; display: flex; gap: 0.55em; padding: 0.08em 0.3em 0.08em 1.3em; border-radius: 6px;
    line-height: 1.35; color: #a8a29e;
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .opt .sel { position: absolute; left: 0.3em; opacity: 0; }
  [data-composition-id="text-terminal-prompt-25-tb"] .opt .hl { position: absolute; inset: 0; border-radius: 6px; opacity: 0; }
  [data-composition-id="text-terminal-prompt-25-tb"] .opt .hl.y { background: rgba(74, 222, 128, 0.16); }
  [data-composition-id="text-terminal-prompt-25-tb"] .opt .hl.n { background: color-mix(in srgb, var(--tb-accent) 20%, transparent); }
  [data-composition-id="text-terminal-prompt-25-tb"] .opt .txt, [data-composition-id="text-terminal-prompt-25-tb"] .opt .n { position: relative; }
  [data-composition-id="text-terminal-prompt-25-tb"] .stampw {
    position: absolute; left: 1060px; top: 670px; transform: translate(-50%, -50%) rotate(-6deg);
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .shk { display: flex; flex-direction: column; align-items: center; gap: 0.15em; }
  [data-composition-id="text-terminal-prompt-25-tb"] .stamp {
    font-family: var(--tb-font-stamp); color: var(--tb-stamp); font-size: clamp(120px, 27.78vmin, 300px); line-height: 0.95;
    white-space: nowrap; letter-spacing: 0.01em; opacity: 0;
    text-shadow: 0 0.04em 0 rgba(0,0,0,0.35), 0 0 0.25em color-mix(in srgb, var(--tb-stamp) 40%, transparent);
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .meter {
    display: flex; align-items: center; gap: 0.6em; padding: 0.3em 0.7em; border-radius: 999px;
    background: rgba(20, 18, 20, 0.95); border: 2px solid #2a2629; opacity: 0;
    font-size: clamp(22px, 3.0vmin, 40px); font-weight: 600; color: #F5F5F4; white-space: nowrap;
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .meter .vals { display: grid; color: var(--tb-stamp); }
  [data-composition-id="text-terminal-prompt-25-tb"] .meter .vals span { grid-area: 1 / 1; }
  [data-composition-id="text-terminal-prompt-25-tb"] .meter .track { width: 6em; height: 0.36em; border-radius: 9px; background: #2a2629; overflow: hidden; }
  [data-composition-id="text-terminal-prompt-25-tb"] .meter .fill { width: 100%; height: 100%; background: var(--tb-stamp); transform-origin: 0 50%; transform: scaleX(0.1); }
  [data-composition-id="text-terminal-prompt-25-tb"] .cmd {
    position: absolute; left: 90px; right: 90px; top: 960px;
    font-size: clamp(26px, 3.6vmin, 52px); font-weight: 600; color: var(--tb-stamp); white-space: pre-wrap;
  }
  [data-composition-id="text-terminal-prompt-25-tb"] .cmd span { opacity: 0; }
</style>

<div class="scene">
  <div class="bar"><span><b data-k="header">you@studio ~/tareabox</b></span><span data-k="tag">tareabox · autopilot</span></div>
  <div class="box">
    <div class="titles"><span class="t1" data-k="ask1">Allow AI to write your captions?</span><span class="t2" data-k="ask2">Allow AI to design your posts?</span><span class="t3" data-k="ask3">Allow AI to plan a whole month?</span></div>
    <div class="opt o1"><span class="hl y"></span><span class="hl n"></span><span class="sel">&#x276F;</span><span class="n">1.</span><span class="txt" data-k="opt1">Yes</span></div>
    <div class="opt o2"><span class="hl y"></span><span class="hl n"></span><span class="sel">&#x276F;</span><span class="n">2.</span><span class="txt" data-k="opt2">Yes, and don't ask again</span></div>
    <div class="opt o3"><span class="hl y"></span><span class="hl n"></span><span class="sel">&#x276F;</span><span class="n">3.</span><span class="txt" data-k="opt3">No, let's not get ahead—</span></div>
  </div>
</div>
<div class="cmd"></div>
<div class="stampw"><div class="shk" data-layout-allow-overflow>
  <div class="stamp" data-k="stamp">TOO LATE!</div>
  <div class="meter"><span data-k="meter">creativity</span><span class="vals"><span class="v1">0.2</span><span class="v2">1.8</span></span><span class="track"><span class="fill" style="display:block"></span></span></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  window.__timelines["text-terminal-prompt-25-tb"] = (function () {
    const ID = "text-terminal-prompt-25-tb", DUR = 9;
    const root = document.querySelector('[data-composition-id="' + ID + '"]');
    const q = (s) => root.querySelector(s);
    const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
    const val = (k, d) => (V[k] !== undefined && V[k] !== null && V[k] !== "") ? String(V[k]) : d;
    root.querySelectorAll("[data-k]").forEach((el) => { el.textContent = val(el.dataset.k, el.textContent); });
    if (V.accent) root.style.setProperty("--tb-accent", V.accent);
    if (V.stampColor) root.style.setProperty("--tb-stamp", V.stampColor);

    const cmd = q(".cmd");
    const cmdChars = [...val("command", "$ tareabox --autopilot --no-limits")].map((c) => {
      const s = document.createElement("span"); s.textContent = c; cmd.appendChild(s); return s;
    });

    const tl = gsap.timeline({ paused: true });
    const opt = (i) => q(".o" + i);
    // Select option i with color c (instant highlight, like a real terminal).
    const select = (i, c, t) => {
      tl.set(opt(i).querySelector(c === "yes" ? ".hl.y" : ".hl.n"), { opacity: 1 }, t);
      tl.set(opt(i).querySelector(".sel"), { opacity: 1 }, t);
      tl.set(opt(i), { color: c === "yes" ? "var(--tb-yes)" : "var(--tb-accent)" }, t);
    };
    const clear = (i, t) => {
      tl.set(opt(i).querySelectorAll(".hl"), { opacity: 0 }, t);
      tl.set(opt(i).querySelector(".sel"), { opacity: 0 }, t);
      tl.set(opt(i), { color: "#a8a29e" }, t);
    };
    const title = (n, t) => { [1, 2, 3].forEach((k) => tl.set(q(".t" + k), { opacity: k === n ? 1 : 0 }, t)); };

    // Box in.
    title(1, 0);
    tl.fromTo(".box", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 0.2);
    // Round 1 & 2: instant "Yes".
    select(1, "yes", 1.35); clear(1, 1.95);
    tl.fromTo(".box", { opacity: 0.35 }, { opacity: 1, duration: 0.2, immediateRender: false }, 1.95); title(2, 1.95);
    select(1, "yes", 2.95); clear(1, 3.55);
    tl.fromTo(".box", { opacity: 0.35 }, { opacity: 1, duration: 0.2, immediateRender: false }, 3.55); title(3, 3.55);
    // Round 3: hesitation, cursor walks down to "No".
    select(1, "yes", 4.35); clear(1, 4.7);
    select(2, "yes", 4.7); clear(2, 5.05);
    select(3, "no", 5.05);

    // TOO LATE slam + shake; scene dims.
    const SLAM = 5.75;
    tl.to(".scene", { opacity: 0.35, duration: 0.25 }, SLAM);
    tl.fromTo(".stamp", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in", immediateRender: false }, SLAM);
    const shake = [[-22, 10], [18, -12], [-14, 8], [10, -6], [-6, 4], [3, -2], [0, 0]];
    shake.forEach(([x, y], i) => tl.to(".shk", { x: x, y: y, duration: 0.045, ease: "none" }, SLAM + 0.22 + i * 0.045));
    // Meter jumps from low to high.
    tl.fromTo(".meter", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, SLAM + 0.5);
    tl.set(".v2", { opacity: 0 }, 0);
    tl.to(".fill", { scaleX: 1, duration: 0.9, ease: "power3.in" }, SLAM + 0.9);
    tl.set(".v1", { opacity: 0 }, SLAM + 1.6);
    tl.set(".v2", { opacity: 1 }, SLAM + 1.6);
    // Bottom command types in red.
    cmdChars.forEach((c, j) => tl.set(c, { opacity: 1 }, SLAM + 0.6 + j * 0.03));

    tl.to({}, { duration: DUR }, 0);
    return tl;
  })();
</script>
</div>
</body>
</html>
