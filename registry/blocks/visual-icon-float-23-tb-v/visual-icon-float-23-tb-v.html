<!doctype html>
<!--
  © 2026 Natalie Digital · tareabox.com · Tareabox Hyperframes Pack
  visual-icon-float-23-tb-v (vertical 1080x1920)
  Tareabox Hyperframes Effect
  Description: Any image (social icon, logo or photo, set by URL) floats in a soft figure-eight with a breathing glow. Loops seamlessly.
  Category: visual
  Duration: 4 seconds (seamless loop)
  REQUIRES: gsap (CDN)
-->
<html lang="en" data-composition-variables='[
  {"id":"image","type":"string","label":"Image URL (png, jpg, svg)","default":""},
  {"id":"glow","type":"color","label":"Glow color","default":"#fe83b9"},
  {"id":"bg","type":"string","label":"Background (color or \"transparent\")","default":"#1d1f31"}
]'>
<head>
  <meta charset="UTF-8" />
</head>
<body>
<div id="visual-icon-float-23-tb-v" data-composition-id="visual-icon-float-23-tb-v"
     data-width="1080" data-height="1920"
     data-start="0" data-duration="4">
<style>
    /* ═══════════════════════════════════════════════════════ */
    /* 🎨 CUSTOMIZE HERE                                       */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="visual-icon-float-23-tb-v"] {
      --tb-bg:        #1d1f31;
      --tb-accent:    var(--tb-brand-accent, #fe83b9);   /* glow */
      --tb-icon-size: 22vmin;                           /* size of the floating image */
      --tb-icon-radius: 28%;                            /* 50% = circle, 28% = app icon, 0 = square */
      --tb-image: "";                                   /* image URL — empty = built-in heart icon */
    }
    /* ═══════════════════════════════════════════════════════ */
    /* ⛔ EFFECT CODE                                          */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="visual-icon-float-23-tb-v"] {
      position: relative; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(ellipse 70% 70% at 50% 50%,
        color-mix(in srgb, var(--tb-bg) 82%, #fff) 0%, var(--tb-bg) 65%,
        color-mix(in srgb, var(--tb-bg) 70%, #000) 100%);
    }
    [data-composition-id="visual-icon-float-23-tb-v"] * { margin: 0; padding: 0; box-sizing: border-box; }
    [data-composition-id="visual-icon-float-23-tb-v"] .float {
      position: absolute; left: 0; top: 0;
      width: var(--tb-icon-size); height: var(--tb-icon-size);
      margin-left: calc(var(--tb-icon-size) / -2); margin-top: calc(var(--tb-icon-size) / -2);
    }
    [data-composition-id="visual-icon-float-23-tb-v"] .halo {
      position: absolute; inset: -60%; border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--tb-accent) 45%, transparent) 0%, transparent 65%);
    }
    [data-composition-id="visual-icon-float-23-tb-v"] .icon {
      position: absolute; inset: 0; border-radius: var(--tb-icon-radius); overflow: hidden;
      background: var(--tb-accent);
      box-shadow: 0 2.4vmin 5vmin rgba(0,0,0,0.45), 0 0 4vmin color-mix(in srgb, var(--tb-accent) 60%, transparent);
      display: flex; align-items: center; justify-content: center;
    }
    [data-composition-id="visual-icon-float-23-tb-v"] .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    [data-composition-id="visual-icon-float-23-tb-v"] .icon svg { width: 56%; height: 56%; }
    [data-composition-id="visual-icon-float-23-tb-v"] .shadow {
      position: absolute; left: 0; top: 0; width: var(--tb-icon-size); height: calc(var(--tb-icon-size) * 0.18);
      margin-left: calc(var(--tb-icon-size) / -2); border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0,0,0,0.45) 0%, transparent 70%);
    }
</style>
    <div class="shadow" id="if23v-shadow"></div>
    <div class="float" id="if23v-float">
      <div class="halo" id="if23v-halo"></div>
      <div class="icon" id="if23v-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3.1 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 2.9 1.5-1.8 3-2.9 5.1-2.9 3.8 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
    window.__timelines = window.__timelines || {};
    window.__timelines["visual-icon-float-23-tb-v"] = (function () {
      const root   = document.querySelector('[data-composition-id="visual-icon-float-23-tb-v"]');
      const fl     = root.querySelector("#if23v-float");
      const halo   = root.querySelector("#if23v-halo");
      const shadow = root.querySelector("#if23v-shadow");
      const icon   = root.querySelector("#if23v-icon");

      /* Native HyperFrames variables → override CSS custom properties */
      const V = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables() : {};
      if (V.glow) root.style.setProperty("--tb-accent", V.glow);
      if (V.bg)   root.style.setProperty("--tb-bg", V.bg);
      if (V.image) root.style.setProperty("--tb-image", '"' + V.image + '"');

      const url = getComputedStyle(root).getPropertyValue("--tb-image").trim().replace(/^["']|["']$/g, "");
      if (url) { icon.innerHTML = ""; const img = document.createElement("img"); img.src = url; img.alt = ""; icon.appendChild(img); }

      /* Figure-eight path, sized from the canvas (works in any aspect ratio) */
      const W = parseFloat(root.getAttribute("data-width")), H = parseFloat(root.getAttribute("data-height"));
      const M = Math.min(W, H);
      const CX = W / 2, CY = H / 2, RX = M * 0.22, RY = M * 0.13, LOOP = 4;

      function render(t) {
        const a = (2 * Math.PI * t) / LOOP;
        const x = CX + RX * Math.sin(a), y = CY + RY * Math.sin(2 * a);
        const breathe = 1 + 0.12 * Math.sin(2 * a + 1);
        const tilt = 6 * Math.cos(a);                       /* gentle sway */
        fl.style.transform = `translate(${x}px, ${y}px) rotate(${tilt}deg)`;
        halo.style.transform = `scale(${breathe})`;
        shadow.style.transform = `translate(${x}px, ${CY + M * 0.26}px) scale(${1.15 - 0.15 * Math.sin(2 * a)})`;
      }

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: LOOP, duration: LOOP, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      return tl;
    })();
  </script>
</div>
</body>
</html>
