      data-composition-id="visual-pov-bold-20-tb-v"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="5"

        <div class="pb-head">
          <div class="pb-pill" id="pb-pill"><span class="pb-dot"></span><span id="pb-pill-txt">POV CREATOR</span></div>

        <div class="pb-media" id="pb-media">

            src="https://assets.mixkit.co/dnci616j6m58wnclcn8r3qvooeww"
            data-start="0" data-duration="5" data-track-index="0"
            muted playsinline loop
          ></video>
        </div>
        <div class="pb-handle" id="pb-handle">@nataliedigital</div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        window.__timelines["visual-pov-bold-20-tb-v"] = (function () {
          const NAME = "visual-pov-bold-20-tb-v";
          const root = document.querySelector('[data-composition-id="' + NAME + '"]');
          const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};

          if (V.bg) root.style.background = V.bg;
          if (V.ink) root.style.setProperty("color", V.ink);
          if (V.pill !== undefined) document.getElementById("pb-pill-txt").textContent = V.pill;
          if (V.handle !== undefined) document.getElementById("pb-handle").textContent = V.handle;
          document.getElementById("pb-setup").textContent = V.setup != null ? V.setup : "";
          const em = document.getElementById("pb-em");

          if (V.accent) em.style.color = V.accent;
          const vid = document.getElementById("pb-vid");
          if (V.clip && vid.getAttribute("src") !== V.clip) vid.src = V.clip;

          const tl = gsap.timeline({ paused: true });
          tl.from("#pb-pill", { y: -18, opacity: 0, duration: 0.5, ease: "back.out(1.6)" }, 0.1);
          tl.from("#pb-cap", { y: 22, opacity: 0, duration: 0.65, ease: "power3.out" }, 0.25);
          tl.from("#pb-em", { opacity: 0, duration: 0.3, ease: "power2.out" }, 0.7);
          tl.from("#pb-media", { y: 40, opacity: 0, duration: 0.75, ease: "power3.out" }, 0.45);
          tl.from("#pb-handle", { opacity: 0, duration: 0.5, ease: "power2.out" }, 0.7);
          tl.to({}, { duration: 5 }, 0);
          return tl;
        })();
      </script>
    </div>
