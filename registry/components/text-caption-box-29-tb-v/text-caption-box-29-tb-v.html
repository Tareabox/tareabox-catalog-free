<!doctype html>
<!--
  © 2026 Natalie Digital · tareabox.com · Tareabox Hyperframes Pack
  text-caption-box-29-tb-v (vertical 1080x1920)
  Tareabox Hyperframes Effect
  Description: Hormozi-style word-by-word caption — each active word gets a solid color box that pops and jumps across the phrase. Demo over a Pexels talking-head clip; swap for your own footage.
  Category: text
  Duration: 5 seconds
  REQUIRES: gsap (CDN)
-->
<html lang="en" data-composition-variables='[
  {"id":"text","type":"string","label":"Caption phrase","default":"This changes everything"},
  {"id":"accent","type":"color","label":"Highlight box color","default":"#33EFE0"},
  {"id":"boxtext","type":"color","label":"Boxed word text color","default":"#1D1F31"},
  {"id":"bg","type":"string","label":"Background (color or \"transparent\")","default":"transparent"}
]'>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=block" rel="stylesheet" />
</head>
<body>
<div id="text-caption-box-29-tb-v" data-composition-id="text-caption-box-29-tb-v"
       data-width="1080" data-height="1920"
       data-start="0" data-duration="5">
<style>
    /* ═══════════════════════════════════════════════════════ */
    /* 🎨 CUSTOMIZE HERE                                       */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="text-caption-box-29-tb-v"] {
      --tb-bg:           #0a0a0a;
      --tb-text:         #ffffff;
      --tb-accent:       var(--tb-brand-accent, #33EFE0);
      --tb-box-text:     #1D1F31;
      --tb-font-display: var(--tb-brand-font-display, "Geist", sans-serif);

      --text: "This changes everything";
    }
    /* ═══════════════════════════════════════════════════════ */
    /* ⛔ EFFECT CODE                                          */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="text-caption-box-29-tb-v"] {
      position: relative; width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: var(--tb-font-display);
    }
    [data-composition-id="text-caption-box-29-tb-v"] * { margin: 0; padding: 0; box-sizing: border-box; }

    [data-composition-id="text-caption-box-29-tb-v"] .bg-video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }
    [data-composition-id="text-caption-box-29-tb-v"] .scrim {
      position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.12) 38%, rgba(0,0,0,0) 60%);
    }
    [data-composition-id="text-caption-box-29-tb-v"] .stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 0 8% 20%;
      z-index: 2;
    }
    [data-composition-id="text-caption-box-29-tb-v"] .caption {
      display: flex; flex-wrap: wrap;
      align-items: center; justify-content: center;
      gap: 0.10em 0.16em;
      font-size: clamp(64px, 11vmin, 150px);
      font-weight: 800;
      line-height: 1.04;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      text-align: center;
    }
    [data-composition-id="text-caption-box-29-tb-v"] .cb-word {
      position: relative;
      display: inline-flex;
      padding: 0.04em 0.16em;
    }
    [data-composition-id="text-caption-box-29-tb-v"] .cb-box {
      position: absolute; inset: 0;
      background: var(--tb-accent);
      border-radius: 0.12em;
      transform: scale(0.6);
      opacity: 0;
      z-index: 0;
      box-shadow: 0 0.6vmin 2.2vmin rgba(0,0,0,0.35);
    }
    [data-composition-id="text-caption-box-29-tb-v"] .cb-txt {
      position: relative; z-index: 1;
      color: var(--tb-text);
      text-shadow:
        0 0.4vmin 1.6vmin rgba(0,0,0,0.85),
        0 0.15vmin 0.4vmin rgba(0,0,0,0.95);
    }
</style>

    <!--
      ASSET (vertical) — demo talking-head from Pexels (free license).
      To use your own footage, replace the `src` below with:
        Public URL:   src="https://yourdomain.com/your-video.mp4"
        Local path:   src="../assets/tb-media/your-video.mp4"
      Or set the "Background" variable to a solid color / "transparent"
      to use this caption as an overlay on top of another clip.
    -->
    <video id="cb29v-vid" class="bg-video"
           src="https://videos.pexels.com/video-files/8688204/8688204-hd_1080_1920_25fps.mp4"
           crossorigin="anonymous" data-tb-asset="vertical"
           data-start="0" data-duration="5" data-track-index="0"
           muted playsinline loop></video>
    <div class="scrim"></div>
    <div class="stage">
      <div class="caption" id="cb29v-cap"></div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
    window.__timelines = window.__timelines || {};
    window.__timelines["text-caption-box-29-tb-v"] = (function () {
      const root = document.querySelector('[data-composition-id="text-caption-box-29-tb-v"]');
      const cap  = root.querySelector("#cb29v-cap");

      const V = (window.__hyperframes && window.__hyperframes.getVariables)
        ? window.__hyperframes.getVariables() : {};
      if (V.accent)  root.style.setProperty("--tb-accent", V.accent);
      if (V.boxtext) root.style.setProperty("--tb-box-text", V.boxtext);
      if (V.bg && V.bg !== "transparent") {
        root.style.background = V.bg;
        const vid = root.querySelector(".bg-video"); if (vid) vid.style.display = "none";
      }

      const cs      = getComputedStyle(root);
      const boxText = cs.getPropertyValue("--tb-box-text").trim() || "#1D1F31";
      const white   = cs.getPropertyValue("--tb-text").trim() || "#ffffff";

      const raw = (V.text != null && V.text !== "")
        ? V.text
        : (cs.getPropertyValue("--text").trim().replace(/^["']|["']$/g, "") || "This changes everything");
      const words = String(raw).toUpperCase().split(/\s+/).filter(Boolean);

      const escapeHTML = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      cap.innerHTML = words.map((w) =>
        '<span class="cb-word"><span class="cb-box"></span><span class="cb-txt">' + escapeHTML(w) + '</span></span>'
      ).join("");

      const wordEls = cap.querySelectorAll(".cb-word");
      const TOTAL = 5;
      const START = 0.45;
      const STEP  = Math.min(0.42, Math.max(0.22, (TOTAL * 0.52) / Math.max(words.length, 1)));

      const tl = gsap.timeline({ paused: true });
      tl.set(wordEls, { visibility: "hidden" }, 0);

      wordEls.forEach((wEl, i) => {
        const box = wEl.querySelector(".cb-box");
        const txt = wEl.querySelector(".cb-txt");
        const t   = START + i * STEP;

        tl.set(wEl, { visibility: "visible" }, t);
        tl.from(wEl, { y: "0.18em", scale: 0.82, opacity: 0, duration: 0.20, ease: "back.out(2)" }, t);
        tl.fromTo(box, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(3)" }, t);
        tl.set(txt, { color: boxText }, t + 0.05);

        if (i > 0) {
          const pBox = wordEls[i - 1].querySelector(".cb-box");
          const pTxt = wordEls[i - 1].querySelector(".cb-txt");
          tl.to(pBox, { opacity: 0, scale: 0.9, duration: 0.13, ease: "power1.in" }, t);
          tl.set(pTxt, { color: white }, t + 0.02);
        }
      });

      tl.to({}, { duration: TOTAL }, 0);
      return tl;
    })();
  </script>
</div>
</body>
</html>
