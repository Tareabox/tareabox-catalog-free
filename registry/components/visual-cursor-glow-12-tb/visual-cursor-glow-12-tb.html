<!doctype html>
<!--
  © 2026 Natalie Digital · tareabox.com · Tareabox Hyperframes Pack
  visual-cursor-glow-12-tb (horizontal 1920x1080)
  Tareabox Hyperframes Effect
  Description: Horizontal 16:9 — A glowing tap/cursor highlight glides onto a UI control and "taps" it (pulse ring + toggle flip), focusing the active row. Screen-recording tutorial vibe.
  Category: visual
  Duration: 3.5 seconds
  REQUIRES: gsap (CDN)
  NOTE: the dark settings card is a DEMO backdrop — replace it with your own screen recording / UI and keep the .tap-glow + .tap-ring layer to reuse the effect.
-->
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Card title","default":"Preferences"},
  {"id":"icon1","type":"string","label":"Row 1 icon (emoji)","default":"🌙"},
  {"id":"row1","type":"string","label":"Row 1 label","default":"Night theme"},
  {"id":"icon2","type":"string","label":"Row 2 icon (emoji)","default":"🔊"},
  {"id":"row2","type":"string","label":"Row 2 label","default":"Sound effects"},
  {"id":"targetIcon","type":"string","label":"Tapped row icon (emoji)","default":"💾"},
  {"id":"targetLabel","type":"string","label":"Tapped row label","default":"Auto-save"},
  {"id":"accent","type":"color","label":"Glow & highlight color","default":"#4da3ff"},
  {"id":"bg","type":"string","label":"Background (color or \"transparent\")","default":"#0a0b0f"}
]'>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=block" rel="stylesheet" />
</head>
<body>
<div id="visual-cursor-glow-12-tb" data-composition-id="visual-cursor-glow-12-tb"
       data-width="1920" data-height="1080"
       data-start="0" data-duration="3.5">
<style>
    /* ═══════════════════════════════════════════════════════ */
    /* 🎨 CUSTOMIZE HERE                                       */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="visual-cursor-glow-12-tb"] {
      --tb-bg:           #0a0b0f;
      --tb-card:         #14151b;
      --tb-row:          #1b1d25;
      --tb-text:         #f4f5f7;
      --tb-text-dim:     #8a8d99;
      --tb-accent:       var(--tb-brand-accent, #4da3ff);
      --tb-font-display: var(--tb-brand-font-display, "Geist", sans-serif);

      --title:        "Preferences";
      --icon1:        "🌙";
      --row1:         "Night theme";
      --icon2:        "🔊";
      --row2:         "Sound effects";
      --target-icon:  "💾";
      --target-label: "Auto-save";
    }
    /* ═══════════════════════════════════════════════════════ */
    /* ⛔ EFFECT CODE                                          */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="visual-cursor-glow-12-tb"] {
      position: relative; width: 100%; height: 100%;
      background: var(--tb-bg);
      overflow: hidden;
      font-family: var(--tb-font-display);
    }
    [data-composition-id="visual-cursor-glow-12-tb"] * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── DEMO backdrop: dark settings card (replace with your screen recording) ── */
    [data-composition-id="visual-cursor-glow-12-tb"] .stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 0;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .card {
      width: 56vmin;
      background: var(--tb-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4vmin;
      padding: 3.4vmin 2.8vmin;
      box-shadow: 0 3vmin 9vmin rgba(0,0,0,0.55);
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .card-title {
      font-size: clamp(26px, 3.4vmin, 46px);
      font-weight: 700; color: var(--tb-text);
      letter-spacing: -0.01em;
      padding: 0 1vmin 2.6vmin;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .row {
      position: relative;
      display: flex; align-items: center; gap: 2.2vmin;
      padding: 2.4vmin 2.4vmin;
      border-radius: 2.6vmin;
      background: var(--tb-row);
      margin-bottom: 1.8vmin;
      transition: none;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .row:last-child { margin-bottom: 0; }
    [data-composition-id="visual-cursor-glow-12-tb"] .ic {
      width: 6vmin; height: 6vmin; flex: 0 0 auto;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8vmin;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .row-label {
      flex: 1 1 auto;
      font-size: clamp(20px, 2.6vmin, 38px);
      font-weight: 500; color: var(--tb-text);
    }
    /* toggle pill */
    [data-composition-id="visual-cursor-glow-12-tb"] .toggle {
      position: relative; flex: 0 0 auto;
      width: 10vmin; height: 5.4vmin;
      border-radius: 999px;
      background: #3a3d47;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .toggle .knob {
      position: absolute; top: 0.7vmin; left: 0.7vmin;
      width: 4vmin; height: 4vmin;
      border-radius: 50%; background: #f4f5f7;
      box-shadow: 0 0.4vmin 1.2vmin rgba(0,0,0,0.4);
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .toggle.on  { background: var(--tb-accent); }

    /* ── the reusable EFFECT layer: tap glow + pulse ring (CSS-anchored to the toggle, no JS measurement) ── */
    [data-composition-id="visual-cursor-glow-12-tb"] .tap-anchor {
      position: absolute; left: 50%; top: 50%;
      width: 0; height: 0;
      z-index: 6; pointer-events: none;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .tap-ring {
      position: absolute; left: 0; top: 0;
      width: 13vmin; height: 13vmin;
      margin-left: -6.5vmin; margin-top: -6.5vmin;
      border-radius: 50%;
      border: 0.6vmin solid var(--tb-accent);
      opacity: 0;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .tap-cursor {
      position: absolute; left: 0; top: 0;
      width: 18vmin; height: 18vmin;
      margin-left: -9vmin; margin-top: -9vmin;
      opacity: 0;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .tap-glow {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(255,255,255,0.98) 0%,
        var(--tb-accent) 30%,
        color-mix(in srgb, var(--tb-accent) 55%, transparent) 52%,
        transparent 72%);
      filter: blur(0.5vmin);
      mix-blend-mode: screen;
    }
    [data-composition-id="visual-cursor-glow-12-tb"] .tap-core {
      position: absolute; left: 50%; top: 50%;
      width: 5vmin; height: 5vmin;
      margin-left: -2.5vmin; margin-top: -2.5vmin;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0.7) 45%, transparent 70%);
    }
</style>

    <div class="stage">
      <div class="card" id="cg12h-card">
        <div class="card-title" id="cg12h-title">Preferences</div>
        <div class="row" id="cg12h-r1">
          <div class="ic" id="cg12h-i1">🌙</div>
          <div class="row-label" id="cg12h-l1">Night theme</div>
          <div class="toggle on"><div class="knob" style="left:auto;right:0.7vmin"></div></div>
        </div>
        <div class="row" id="cg12h-r2">
          <div class="ic" id="cg12h-i2">🔊</div>
          <div class="row-label" id="cg12h-l2">Sound effects</div>
          <div class="toggle on"><div class="knob" style="left:auto;right:0.7vmin"></div></div>
        </div>
        <div class="row" id="cg12h-r3">
          <div class="ic" id="cg12h-i3">💾</div>
          <div class="row-label" id="cg12h-label">Auto-save</div>
          <div class="toggle" id="cg12h-toggle">
            <div class="knob" id="cg12h-knob"></div>
            <div class="tap-anchor">
              <div class="tap-ring" id="cg12h-ring"></div>
              <div class="tap-cursor" id="cg12h-cursor">
                <div class="tap-glow"></div>
                <div class="tap-core"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
    window.__timelines = window.__timelines || {};
    window.__timelines["visual-cursor-glow-12-tb"] = (function () {
      const root = document.querySelector('[data-composition-id="visual-cursor-glow-12-tb"]');
      const cs   = getComputedStyle(root);

      const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      const setStr = (cssVar, val) => { if (val !== undefined && val !== null && val !== "") root.style.setProperty(cssVar, '"' + String(val) + '"'); };
      const setRaw = (cssVar, val) => { if (val !== undefined && val !== null && val !== "") root.style.setProperty(cssVar, String(val)); };
      const readVar = (cssVar) => cs.getPropertyValue(cssVar).trim().replace(/^["']|["']$/g, "");
      setStr("--title",        V.title);
      setStr("--icon1",        V.icon1);
      setStr("--row1",         V.row1);
      setStr("--icon2",        V.icon2);
      setStr("--row2",         V.row2);
      setStr("--target-icon",  V.targetIcon);
      setStr("--target-label", V.targetLabel);
      setRaw("--tb-accent",    V.accent);
      setRaw("--tb-bg",        V.bg);

      // apply editable text + icons
      root.querySelector("#cg12h-title").textContent = readVar("--title");
      root.querySelector("#cg12h-i1").textContent    = readVar("--icon1");
      root.querySelector("#cg12h-l1").textContent    = readVar("--row1");
      root.querySelector("#cg12h-i2").textContent    = readVar("--icon2");
      root.querySelector("#cg12h-l2").textContent    = readVar("--row2");
      root.querySelector("#cg12h-i3").textContent    = readVar("--target-icon");
      root.querySelector("#cg12h-label").textContent = readVar("--target-label");

      // accent → rgba helper so the row highlight also follows the chosen color
      const accentHex = cs.getPropertyValue("--tb-accent").trim() || "#4da3ff";
      const hexToRgba = (hex, a) => {
        const m = hex.replace("#","").match(/[0-9a-f]{2}/gi);
        if (!m || m.length !== 3) return hex;
        return "rgba(" + parseInt(m[0],16) + "," + parseInt(m[1],16) + "," + parseInt(m[2],16) + "," + a + ")";
      };
      const accBg   = hexToRgba(accentHex, 0.16);
      const accRing = hexToRgba(accentHex, 0.55);

      const rows    = [root.querySelector("#cg12h-r1"), root.querySelector("#cg12h-r2"), root.querySelector("#cg12h-r3")];
      const target  = root.querySelector("#cg12h-r3");
      const toggle  = root.querySelector("#cg12h-toggle");
      const knob    = root.querySelector("#cg12h-knob");
      const card    = root.querySelector("#cg12h-card");
      const cursor  = root.querySelector("#cg12h-cursor");
      const ring    = root.querySelector("#cg12h-ring");

      const TOTAL = 3.5;
      const tl = gsap.timeline({ paused: true });

      // card + rows settle in
      gsap.set(card, { transformOrigin: "50% 50%" });
      tl.from(card, { opacity: 0, y: 36, scale: 0.97, duration: 0.5, ease: "power3.out" }, 0);
      tl.from(rows, { opacity: 0, y: 18, duration: 0.4, stagger: 0.08, ease: "power2.out" }, 0.12);

      // cursor glides in toward the toggle (offsets are % of its OWN size → deterministic, no measuring)
      gsap.set(cursor, { xPercent: 72, yPercent: -118, opacity: 0, scale: 1, transformOrigin: "50% 50%" });
      tl.to(cursor, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.7);
      tl.to(cursor, { xPercent: 0, yPercent: 0, duration: 0.75, ease: "power3.inOut" }, 0.7);

      // arrival "tap": cursor pops, ring expands, row focuses, toggle flips on
      tl.to(cursor, { scale: 0.8,  duration: 0.12, ease: "power2.in" }, 1.5);
      tl.to(cursor, { scale: 1.16, duration: 0.28, ease: "back.out(2.2)" }, 1.62);
      tl.to(cursor, { scale: 1.0,  duration: 0.3,  ease: "power2.out" }, 1.9);

      gsap.set(ring, { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" });
      tl.set(ring,  { opacity: 0.85, scale: 0.4, borderColor: accentHex }, 1.55);
      tl.to(ring,   { scale: 1.9, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.55);

      // focus the active row, dim the others
      tl.to(target, { backgroundColor: accBg, boxShadow: "0 0 0 0.4vmin " + accRing, scale: 1.03, duration: 0.35, ease: "power2.out", transformOrigin: "50% 50%" }, 1.55);
      tl.to([rows[0], rows[1]], { opacity: 0.4, duration: 0.35, ease: "power2.out" }, 1.55);

      // toggle flips ON: track to accent + knob slides right (xPercent of knob width → deterministic)
      tl.to(toggle, { backgroundColor: accentHex, duration: 0.25, ease: "power1.out" }, 1.62);
      tl.to(knob,   { xPercent: 115, duration: 0.32, ease: "back.out(1.8)" }, 1.62);

      // settle hold
      tl.to({}, { duration: TOTAL }, 0);
      return tl;
    })();
  </script>
</div>
</body>
</html>
