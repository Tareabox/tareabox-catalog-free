<!doctype html>
<!--
  © 2026 Natalie Digital · tareabox.com · Tareabox Hyperframes Pack
  visual-icon-wheel-18-tb-v (vertical 1080x1920)
  Tareabox Hyperframes Effect
  Description: A spinning multicolor ring with bubbles that pop in around a central label card — a "system / toolkit" wheel. Each bubble is an emoji OR an image/logo (drop a URL and it fits the circle).
  Category: visual
  Duration: 5 seconds
  REQUIRES: gsap (CDN)
  EDITABLE (HyperFrames variables): label · icons (8 emoji) · logos (8 image URLs, optional — override the emoji) · accent · bg.
  Tip: square images / app logos look best (they're cover-fit into the circle).
-->
<html lang="en" data-composition-variables='[
  {"id":"label","type":"string","label":"Center label","default":"SYSTEM"},
  {"id":"icons","type":"string","label":"8 emoji (comma-separated)","default":"⚙️,💡,🚀,📊,🎯,⚡,🔥,✅"},
  {"id":"logos","type":"string","label":"8 image/logo URLs (comma-separated, optional)","default":""},
  {"id":"accent","type":"color","label":"Center / glow accent","default":"#33efe0"},
  {"id":"bg","type":"string","label":"Background (color or \"transparent\")","default":"#11131f"}
]'>
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=block" rel="stylesheet" />
</head>
<body>
<div id="visual-icon-wheel-18-tb-v" data-composition-id="visual-icon-wheel-18-tb-v"
       data-width="1080" data-height="1920"
       data-start="0" data-duration="5">
<style>
    /* ═══════════════════════════════════════════════════════ */
    /* 🎨 CUSTOMIZE HERE                                       */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="visual-icon-wheel-18-tb-v"] {
      --tb-text:         #ffffff;
      --tb-accent:       var(--tb-brand-accent, #33efe0);
      --tb-font-display: var(--tb-brand-font-display, "Geist", sans-serif);
      --bg:              #11131f;
      --label:           "SYSTEM";
    }
    /* ═══════════════════════════════════════════════════════ */
    /* ⛔ EFFECT CODE                                          */
    /* ═══════════════════════════════════════════════════════ */
    [data-composition-id="visual-icon-wheel-18-tb-v"] {
      position: relative; width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: var(--tb-font-display);
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] * { margin: 0; padding: 0; box-sizing: border-box; }

    [data-composition-id="visual-icon-wheel-18-tb-v"] .stage {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .wheel {
      position: relative; width: 74vmin; height: 74vmin;
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(from 0deg,
        #ff5470, #ff9f45, #ffd54a, #4ade80, #33efe0, #38bdf8, #818cf8, #c084fc, #ff5470);
      -webkit-mask: radial-gradient(circle, transparent 55%, #000 57%);
              mask: radial-gradient(circle, transparent 55%, #000 57%);
      filter: drop-shadow(0 0 4vmin rgba(0,0,0,0.4));
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .ring-glow {
      position: absolute; left: 50%; top: 50%; width: 92vmin; height: 92vmin;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, color-mix(in srgb, var(--tb-accent) 16%, transparent) 0%, transparent 60%);
      opacity: 0;
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .node {
      position: absolute; top: 50%; left: 50%;
      width: 16vmin; height: 16vmin; margin: -8vmin 0 0 -8vmin;
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n0 { transform: rotate(0deg)   translateY(-31vmin) rotate(0deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n1 { transform: rotate(45deg)  translateY(-31vmin) rotate(-45deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n2 { transform: rotate(90deg)  translateY(-31vmin) rotate(-90deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n3 { transform: rotate(135deg) translateY(-31vmin) rotate(-135deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n4 { transform: rotate(180deg) translateY(-31vmin) rotate(-180deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n5 { transform: rotate(225deg) translateY(-31vmin) rotate(-225deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n6 { transform: rotate(270deg) translateY(-31vmin) rotate(-270deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .n7 { transform: rotate(315deg) translateY(-31vmin) rotate(-315deg); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .bub {
      position: relative;
      width: 100%; height: 100%; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #1b1e2e;            /* fallback; set to a logo image via the logos variable */
      background-repeat: no-repeat; background-position: center; background-size: 62%;  /* logos FIT inside the circle, not cropped */
      border: 0.5vmin solid rgba(255,255,255,0.14);
      box-shadow: 0 1.4vmin 3vmin rgba(0,0,0,0.45);
      overflow: hidden;
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .emo {
      font-size: clamp(28px, 7vmin, 92px); line-height: 1;
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b0 { box-shadow: 0 0 4vmin #ff5470aa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b1 { box-shadow: 0 0 4vmin #ff9f45aa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b2 { box-shadow: 0 0 4vmin #ffd54aaa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b3 { box-shadow: 0 0 4vmin #4ade80aa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b4 { box-shadow: 0 0 4vmin #33efe0aa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b5 { box-shadow: 0 0 4vmin #38bdf8aa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b6 { box-shadow: 0 0 4vmin #818cf8aa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .b7 { box-shadow: 0 0 4vmin #c084fcaa, 0 1.4vmin 3vmin rgba(0,0,0,0.45); }
    /* when a logo image is used, switch to a clean light tile so transparent logos read */
    [data-composition-id="visual-icon-wheel-18-tb-v"] .bub.has-logo { background-color: #ffffff; }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .hub {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      width: 40vmin; height: 40vmin; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #20243a, #0c0e18);
      border: 0.6vmin solid color-mix(in srgb, var(--tb-accent) 55%, transparent);
      box-shadow: 0 0 7vmin color-mix(in srgb, var(--tb-accent) 35%, transparent), inset 0 0 4vmin rgba(0,0,0,0.6);
    }
    [data-composition-id="visual-icon-wheel-18-tb-v"] .hub span {
      font-size: clamp(28px, 6.2vmin, 86px);
      font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase;
      color: var(--tb-text);
      text-shadow: 0 0.3vmin 1.2vmin rgba(0,0,0,0.7);
      text-align: center; padding: 0 2vmin;
    }
</style>

    <div class="stage">
      <div class="ring-glow" id="iw18v-glow"></div>
      <div class="wheel">
        <div class="ring" id="iw18v-ring"></div>
        <div class="node n0"><div class="bub b0"><span class="emo">⚙️</span></div></div>
        <div class="node n1"><div class="bub b1"><span class="emo">💡</span></div></div>
        <div class="node n2"><div class="bub b2"><span class="emo">🚀</span></div></div>
        <div class="node n3"><div class="bub b3"><span class="emo">📊</span></div></div>
        <div class="node n4"><div class="bub b4"><span class="emo">🎯</span></div></div>
        <div class="node n5"><div class="bub b5"><span class="emo">⚡</span></div></div>
        <div class="node n6"><div class="bub b6"><span class="emo">🔥</span></div></div>
        <div class="node n7"><div class="bub b7"><span class="emo">✅</span></div></div>
        <div class="hub" id="iw18v-hub"><span id="iw18v-label"></span></div>
      </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
    window.__timelines = window.__timelines || {};
    window.__timelines["visual-icon-wheel-18-tb-v"] = (function () {
      const root = document.querySelector('[data-composition-id="visual-icon-wheel-18-tb-v"]');
      const cs   = getComputedStyle(root);
      const rd   = (v) => cs.getPropertyValue(v).trim().replace(/^["']|["']$/g, "");

      const V = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      const val = (key, cssName) => (V[key] !== undefined && V[key] !== null && V[key] !== "") ? V[key] : rd(cssName);

      const accent = (V.accent !== undefined && V.accent !== "") ? V.accent : "";
      const bg     = (V.bg !== undefined && V.bg !== "") ? V.bg : "";
      if (accent) root.style.setProperty("--tb-accent", accent);
      if (bg) root.style.setProperty("--bg", bg);

      root.querySelector("#iw18v-label").textContent = val("label", "--label");

      // Split helpers — accept comma OR newline separated lists.
      const split = (s) => String(s || "").split(/[,\n]/).map(v => v.trim());
      const icons = split(val("icons", "")).filter(Boolean);
      const logos = split(V.logos !== undefined ? V.logos : "");

      const bubs = root.querySelectorAll(".bub");
      bubs.forEach((b, i) => {
        const emo = b.querySelector(".emo");
        const logo = logos[i];
        if (logo) {
          // image/logo for this slot — fits the circle (cover)
          b.classList.add("has-logo");
          b.style.backgroundImage = 'url("' + logo + '")';
          if (emo) emo.style.display = "none";
        } else if (icons[i] && emo) {
          emo.textContent = icons[i];
        }
      });

      const ring = root.querySelector("#iw18v-ring");
      const glow = root.querySelector("#iw18v-glow");
      const hub  = root.querySelector("#iw18v-hub");

      const TOTAL = 5;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
      tl.fromTo(ring, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)" }, 0.1);
      tl.to(ring, { rotation: 60, duration: TOTAL, ease: "none" }, 0.1);
      tl.fromTo(hub, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(2)" }, 0.35);
      tl.fromTo(bubs, { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)", stagger: 0.07 }, 0.55);

      tl.to({}, { duration: TOTAL }, 0);
      return tl;
    })();
  </script>
</div>
</body>
</html>
